name: aimsegdl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.4
  - numpy=1.26
  - pandas=1.5.3
  - matplotlib
  - scikit-learn
  - opencv
  - seaborn
  - tqdm
  - colorcet
  - ipykernel
  - scipy
  - pip
  - pip:
      - albumentations==1.3.1
      - monai==1.3.2
      - tensorboard==2.14.0
      - edt==2.4.1
      - bioimageio-core==0.9.0
      - bioimageio-spec==0.5.4.3
