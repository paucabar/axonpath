name: axonpath
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.7.1
  - torchvision=0.22.1
  - torchaudio=2.7.1
  - pytorch-cuda=12.8
  - numpy>=2.0
  - pandas>=2.0
  - matplotlib
  - scikit-image
  - scikit-learn
  - tqdm
  - colorcet
  - ipykernel
  - scipy
  - pip
  - pip:
      - albumentations==1.3.1
      - monai==1.5.1
      - tensorboard==2.20.0
      - edt==3.1.1
      - bioimageio-core==0.9.6
      - bioimageio-spec==0.5.7.4
      - opencv-python-headless
